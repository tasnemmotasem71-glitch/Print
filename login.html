
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام الطباعة والتصوير</title>
</head>
<body>

<header>
    <h1>نظام إدارة خدمات الطباعة والتصوير</h1>
    <p>مرحباً بك في نظامنا لإدارة خدمات الطباعة والتصوير</p>
</header>

<nav>
    <a href="login.html">تسجيل الدخول</a> |
    <a href="register.html">إنشاء حساب</a> |
    <a href="contact.html">اتصل بنا</a>
</nav>

<main>
    <h2>تسجيل الدخول</h2>
    <p>أدخلي بيانات حسابك للدخول إلى النظام.</p>

    <form action="index.html" method="get">
        <label for="username">البريد الإلكتروني أو رقم الهاتف:</label><br>
        <input type="text" id="username" name="username"
               placeholder="أدخلي البريد أو رقم الهاتف" required>
        <br><br>

        <label for="password">كلمة المرور:</label><br>
        <input type="password" id="password" name="password"
               placeholder="أدخلي كلمة المرور" required>
        <br><br>

        <button type="submit">تسجيل الدخول</button>
    </form>

    <p><a href="forgot-password.html">هل نسيت كلمة المرور؟</a></p>
    <p>ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a></p>
</main>

<footer>
    <p>جميع الحقوق محفوظة لنظام إدارة خدمات الطباعة والتصوير</p>
</footer>

</body>
</html>
